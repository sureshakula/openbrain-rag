<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}OpenBrain{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>OpenBrain</h1>
      <nav>
        <a href="/upload"    class="{% if page == 'upload' %}active{% endif %}">Upload</a>
        <a href="/inventory" class="{% if page == 'inventory' %}active{% endif %}">Inventory</a>
        <a href="/docgen"    class="{% if page == 'docgen' %}active{% endif %}">Doc-gen</a>
        <a href="/drafts"    class="{% if page == 'drafts' %}active{% endif %}">
          Drafts{% if pending_drafts %}<span class="badge">{{ pending_drafts }}</span>{% endif %}
        </a>
        <a href="/spaces"    class="{% if page == 'spaces' %}active{% endif %}">Spaces</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
