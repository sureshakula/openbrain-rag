services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${VB_DB_NAME:-openbrain}
      POSTGRES_USER: ${VB_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${VB_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VB_DB_USER:-postgres} -d ${VB_DB_NAME:-openbrain}"]
      interval: 3s
      timeout: 3s
      retries: 20
